name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

concurrency:
  group: curseforge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  curseforge:
    name: CurseForge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only upload tags whose commit is already on origin/main (or an
      # ancestor of it). Fetch main explicitly; a tag checkout may not
      # have that ref, and persist-credentials is off so this is a public
      # unauthenticated fetch.
      - name: Require the tag to be on main
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit $(git rev-parse HEAD) is not an ancestor of origin/main ($(git rev-parse origin/main)). Refusing to upload."
            exit 1
          fi

      # Pin v2.7.0 (SHA of the released tag). No extra args: do not pass -p 0
      # (that unsets TOC X-Curse-Project-ID 1788533). Do not set GITHUB_OAUTH,
      # WAGO_API_TOKEN, or WOWI_API_TOKEN — CurseForge only, no GitHub Release.
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
